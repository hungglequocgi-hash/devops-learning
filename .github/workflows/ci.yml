
name: My First CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check app.txt exists
        run: test -f app.txt && echo "app.txt exists"

      - name: Check app.txt content
        run: grep -q "Hello DevOps WRONG" app.txt && echo "Content is correct"

